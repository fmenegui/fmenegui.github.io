name: Publish bilingual portfolio

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Setup Pandoc
        uses: pandoc/actions/setup@v1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install -r requeriments.txt

      - name: Build both ECG figures using the shared renderer
        run: python blog/ecg_figures.py

      - name: Verify pinned ECG images and matching JSON outputs
        run: python blog/build_ecg_examples.py

      - name: Package the FairLens data and offline reproduction code
        run: python scripts/build_fairlens_downloads.py

      - name: Render site
        run: quarto render

      - name: Build bilingual portfolio
        run: python portfolio/build.py

      - name: Verify search metadata, sitemap, feed and local links
        run: python scripts/check_site.py

      - name: Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
