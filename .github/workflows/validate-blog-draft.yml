name: Validate blog draft (no deploy)
on:
  push:
    branches: [feature/blog-system-one-ecg]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requeriments.txt
      - name: Build shared figures and verify ECG examples
        run: |
          python blog/ecg_figures.py
          python blog/build_ecg_examples.py
      - name: Render both articles
        run: quarto render
      - name: Build portfolio and verify search metadata
        run: |
          python portfolio/build.py
          python scripts/check_site.py
      - name: Check article assets
        run: |
          test -f _site/blog/system-one-ecg/index.html
          test -f _site/blog/system-one-ptbxl/index.html
          test -f _site/blog/system-one-ecg/example-ecg.png
          test -f _site/blog/system-one-ptbxl/example-ecg.png
          test -f _site/blog/system-one-ecg/roc_calibration.svg
          test -f _site/blog/system-one-ptbxl/ptbxl_roc_calibration.svg
